name: Checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.13 --extra test --extra lint ruff check .
      - run: uv run --python 3.13 --extra test --extra lint ruff format --check .
      - run: python scripts/bootstrap_runtime.py --prepare-only
      - run: uv run --python 3.13 --extra test pytest
