[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "oregon-kids-credit-analysis"
version = "0.1.0"
description = "Reproducible Oregon child tax credit scenarios with PolicyEngine"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.10"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "hypothesis==6.170.15", "microdf-python==1.3.0"]
lint = ["ruff==0.17.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
